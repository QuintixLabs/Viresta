name: Bug report
description: Something broke or looks wrong
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      placeholder: After switching to Viresta Light, the panel stayed dark...
      render: text
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Where did it happen?
      options:
        - Installing
        - Updating
        - Uninstalling
        - On the desktop
        - Somewhere else
    validations:
      required: true
  - type: dropdown
    attributes:
      label: What are you running it on?
      options:
        - Desktop
        - Laptop
        - Virtual machine
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Click...
        3. See...
      render: text
  - type: textarea
    attributes:
      label: What did you expect?
      render: text
  - type: textarea
    attributes:
      label: Logs and screenshots
      description: For an install problem, paste what `./install.sh --logs` shows. All the logs are in `~/.local/state/viresta/`.
  - type: textarea
    attributes:
      label: Anything else?
      description: Any other details or screenshots that might help.
      render: text
