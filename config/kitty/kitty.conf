# ==========================================
# Viresta Dark
# ==========================================

# Window
remember_window_size yes
initial_window_width 105c
initial_window_height 20c
window_padding_width 12
background_opacity 0.97

# Font
font_family JetBrains Mono
bold_font JetBrains Mono SemiBold
italic_font auto
bold_italic_font auto
font_size 10.50

# Cursor
cursor_shape beam
cursor_blink_interval 0
cursor_trail 1
cursor_trail_start_threshold 0
cursor_trail_decay 0.1 0.4
cursor_trail_color #919499

# Scrollback
scrollback_lines 10000

# Scrollbar
scrollbar scrolled
scrollbar_interactive yes
scrollbar_width 0.5
scrollbar_hover_width 1
scrollbar_handle_opacity 0.8
scrollbar_radius 0.3
scrollbar_gap 0.1
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0.1
scrollbar_handle_color #919499
scrollbar_track_color #252525

# Tabs
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2
tab_bar_background #111111
active_tab_foreground #0A0A0A
active_tab_background #919499
inactive_tab_foreground #E6E6E6
inactive_tab_background #111111

# Colors
foreground #E6E6E6
background #0A0A0A
selection_foreground #0A0A0A
selection_background #919499
cursor #919499
cursor_text_color #0A0A0A

# Normal colors
color0  #252525
color1  #CF8585
color2  #91B58D
color3  #D6BD83
color4  #82A8D8
color5  #B99ACB
color6  #83B6B5
color7  #E6E6E6

# Bright colors
color8  #555555
color9  #E49A9A
color10 #A5C9A0
color11 #E8D29A
color12 #99BCEB
color13 #CEB0DF
color14 #98CECD
color15 #FFFFFF

# Behavior
confirm_os_window_close 0
enable_audio_bell no
copy_on_select no