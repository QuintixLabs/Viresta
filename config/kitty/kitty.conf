# ==========================================
# Viresta
# Colors are in dark-theme.auto.conf and light-theme.auto.conf,
# which kitty switches between with the system color scheme.
# ==========================================

# Window
remember_window_size yes
initial_window_width 105c
initial_window_height 20c
window_padding_width 12
background_opacity 0.97

# Font
font_family JetBrains Mono
bold_font JetBrains Mono SemiBold
italic_font auto
bold_italic_font auto
font_size 10.50

# Cursor
cursor_shape beam
cursor_blink_interval 0
cursor_trail 1
cursor_trail_start_threshold 0
cursor_trail_decay 0.1 0.4

# Scrollback
scrollback_lines 10000

# Scrollbar
scrollbar scrolled
scrollbar_interactive yes
scrollbar_width 0.5
scrollbar_hover_width 1
scrollbar_handle_opacity 0.8
scrollbar_radius 0.3
scrollbar_gap 0.1
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0.1

# Tabs
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2

# Behavior
confirm_os_window_close 0
enable_audio_bell no
copy_on_select no
